[package]
name = "floetask-infrastructure"
description = "floetask infrastructure layer: file system, config files, watcher, OS integration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
floetask-domain.workspace = true
floetask-application.workspace = true
chrono.workspace = true
serde.workspace = true
toml = "1.1.8+spec-1.1.0"
notify-debouncer-full = "0.7"
notify-rust = "4.18"
open = "5.4"
cargo-packager-updater = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.27"
