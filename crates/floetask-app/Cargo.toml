[package]
name = "floetask-app"
description = "floetask composition root: command line, wiring, start-up"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "floetask"
path = "src/main.rs"

[dependencies]
floetask-application.workspace = true
floetask-infrastructure.workspace = true
floetask-gui.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[build-dependencies]
winresource.workspace = true

# Installers and bundles, built with `cargo packager --release` (see
# features/todo-notes/14-platform.md). Each OS builds its own formats.
[package.metadata.packager]
product-name = "floetask"
identifier = "com.iocast.floetask"
description = "A todo.txt manager for the desktop"
publisher = "iocast"
authors = ["iocast <iocast@me.com>"]
category = "Productivity"
before-packaging-command = "cargo build --release -p floetask-app"
out-dir = "../../target/packages"
binaries = [{ path = "floetask", main = true }]
icons = ["../../assets/icon-512.png", "../../assets/icon-256.png", "../../assets/floetask.ico"]

[package.metadata.packager.nsis]
# Installs for the current user, no admin prompt.
installer-mode = "currentUser"

[package.metadata.packager.wix]
# The built-in template with a "Create a desktop shortcut" checkbox added; the
# NSIS setup already asks on its finish page.
template = "wix/main.wxs"
