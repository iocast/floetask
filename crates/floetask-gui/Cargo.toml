[package]
name = "floetask-gui"
description = "floetask presentation layer: the iced user interface"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
floetask-domain.workspace = true
floetask-application.workspace = true
iced = { version = "0.14", features = ["advanced", "markdown", "svg", "tokio"] }
tokio = { version = "1.53", features = ["rt", "time"] }
rfd = "0.17"
png = "0.18"
iced-markdown-editor = "0.3.1"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"

[dev-dependencies]
iced_test = "0.14"
