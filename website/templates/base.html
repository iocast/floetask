<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{{ config.description }}">
  <meta name="color-scheme" content="light dark">
  <meta property="og:title" content="{{ config.title }}">
  <meta property="og:description" content="{{ config.description }}">
  <meta property="og:image" content="{{ get_url(path='icon-256.png') }}">
  <link rel="icon" type="image/svg+xml" href="{{ get_url(path='logo.svg') }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="{{ get_url(path='') }}">
        <img src="{{ get_url(path='logo.svg') }}" alt="" width="32" height="32">
        <span>floetask</span>
      </a>
      <nav>
        <a href="#features">Features</a>
        <a href="#screenshots">Screenshots</a>
        <a href="#download">Download</a>
        <a href="{{ config.extra.repo }}">GitHub</a>
      </nav>
    </div>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="footer">
    <div class="wrap">
      <p>floetask is open source. Built with Rust and <a href="https://iced.rs">iced</a>.
        Source and issues on <a href="{{ config.extra.repo }}">GitHub</a>.</p>
    </div>
  </footer>
</body>
</html>
