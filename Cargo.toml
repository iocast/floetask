[workspace]
resolver = "3"
members = [
    "crates/floetask-domain",
    "crates/floetask-application",
    "crates/floetask-infrastructure",
    "crates/floetask-gui",
    "crates/floetask-app",
    "tools/render-logo",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.99.0"

[workspace.dependencies]
floetask-domain = { path = "crates/floetask-domain" }
floetask-application = { path = "crates/floetask-application" }
floetask-infrastructure = { path = "crates/floetask-infrastructure" }
floetask-gui = { path = "crates/floetask-gui" }

chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

# Command line and Windows integration (floetask-app, floetask-infrastructure).
# Crates add the windows-sys features they need.
clap = { version = "4", features = ["derive"] }
windows-sys = "0.61"
winresource = "0.1"

# User interface (floetask-gui).
iced = { version = "0.14", features = ["advanced", "markdown", "svg", "tokio"] }
iced_test = "0.14"
iced-markdown-editor = "0.3.3"
tokio = { version = "1.53", features = ["rt", "time"] }
rfd = "0.17"
png = "0.18"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"

# Adapters (floetask-infrastructure).
toml = "1.2.1+spec-1.1.0"
notify-debouncer-full = "0.7"
notify-rust = "4.18"
open = "5.4"
cargo-packager-updater = "0.2"
sys-locale = "0.3.2"

# Icon rendering (tools/render-logo).
resvg = "0.45"
ico = "0.5"

# Tests.
proptest = "1.11"
serde_json = "1.0.154"
tempfile = "3.27"

# iced, wgpu and text shaping are many times slower unoptimised, which makes
# `cargo run` stutter (dragging a todo redraws the window on every mouse
# move). Optimise dependencies in dev builds; floetask's own crates stay
# unoptimised, so they still rebuild fast.
[profile.dev.package."*"]
opt-level = 2
